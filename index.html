<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>快捷定時器</title><style>html{color-scheme:dark;background:#000;color:white;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0}main{max-width:500px;margin:auto;padding:24px 20px 100px}button{font:inherit;cursor:pointer;background:none;border:0;color:#009dff}button:focus-visible{outline:2px solid white}header{display:flex;align-items:center;justify-content:space-between}header button{font-size:35px}h1{font-size:21px;font-weight:500}header span{width:35px}#time{font-size:clamp(58px,15vw,78px);font-weight:300;text-align:center;margin:75px 0 35px;padding:12px 0;border:2px solid white;border-radius:7px;font-variant-numeric:tabular-nums;color:#777}.active{color:#4a97ff!important;border-color:transparent!important}.controls{display:flex;justify-content:space-around;margin-bottom:50px}.controls button{font-size:39px}.controls button:disabled{opacity:.25}#play{color:#d22ce8}#reset{color:#ff454d}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid button{border-radius:60px;background:#1e1e20;min-height:65px;font-size:clamp(18px,5vw,27px);padding:10px 2px}.grid button:active{background:#444}.switch{display:flex;justify-content:center;margin:55px auto 20px;background:#202023;border-radius:10px;width:max-content;padding:3px}.switch button{color:white;padding:10px 13px;border-radius:8px}.selected{background:#59595f}#message{text-align:center;color:#aaa;min-height:20px;font-size:14px}nav{position:fixed;bottom:0;background:#000e;left:50%;transform:translateX(-50%);width:min(100%,500px);display:flex;justify-content:space-around;padding:18px}nav button{color:#777;font-size:12px}nav b{display:block;font-size:30px;font-weight:400;margin-bottom:6px}nav button:first-child{color:#009dff}dialog{background:#19191b;color:white;border:1px solid #444;border-radius:20px;padding:26px;width:min(90%,380px)}dialog::backdrop{background:#000b}label{display:flex;justify-content:space-between;margin:25px 0}input[type=number]{width:90px;padding:10px}dialog button{padding:12px}#full{position:fixed;inset:0;background:black;z-index:10;display:grid;place-items:center}#big{font-size:21vw;font-variant-numeric:tabular-nums;border:2px solid white;padding:20px;border-radius:8px;white-space:nowrap}#close{position:absolute;left:20px;top:20px;font-size:45px}[hidden]{display:none!important}@media(orientation:portrait){#big{transform:rotate(-90deg);font-size:20vh}}.hint{font-size:12px;color:#999;line-height:1.6}</style><main><header><button id="expand" aria-label="大字顯示">⤢</button><h1>快捷定時器</h1><span></span></header><div id="time" role="timer">00:00</div><div class="controls"><button id="play" aria-label="開始" disabled>▷</button><button id="reset" aria-label="重設" disabled>⊗</button><button id="settings" aria-label="設定">⚙</button></div><div id="presets" class="grid"></div><div id="keys" class="grid" hidden></div><div class="switch"><button id="quick" class="selected">快捷按鈕</button><button id="numeric">數字鍵盤</button></div><p id="message" role="status"></p></main><nav><button id="home"><b>ϟ</b>快捷定時器</button><button id="custom"><b>☆</b>自訂時間</button><button id="prefs"><b>⚙</b>設定</button></nav><dialog id="dialog"><h2>定時器設定</h2><label>結束提示音<input id="sound" type="checkbox" checked></label><label>自訂分鐘<input id="minutes" type="number" min="1" max="5999" value="25"></label><button id="apply">套用時間</button><button id="done">完成</button><p class="hint">關閉網頁後不會發出提示音，重新開啟會恢復剩餘時間。數字鍵盤依時、分、秒輸入。</p></dialog><div id="full" hidden><button id="close" aria-label="關閉大字顯示">×</button><button id="big" aria-label="暫停或繼續">00:00</button></div><script>
const $=id=>document.getElementById(id),presets=[['5分',300],['10分',600],['20分',1200],['30分',1800],['40分',2400],['1小時',3600],['1.5小時',5400],['2小時',7200],['10分',600],['15分',900],['1分',60],['5小時',18000]];let remaining=0,running=false,end=0,digits='',sound=true;
function save(){localStorage.setItem('timer-v1',JSON.stringify({remaining,running,end,sound}))}function format(n){n=Math.max(0,Math.ceil(n));let h=Math.floor(n/3600);return(h?h+':':'')+String(Math.floor(n%3600/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function render(){let t=format(remaining);$('time').textContent=$('big').textContent=t;$('time').classList.toggle('active',remaining>0);$('play').textContent=running?'Ⅱ':'▷';$('play').ariaLabel=running?'暫停':'開始';$('play').disabled=remaining<=0;$('reset').disabled=remaining<=0;[...$('presets').children].forEach((b,i)=>b.textContent=(remaining>0?'+ ':'')+presets[i][0]);document.title=(remaining?t+' · ':'')+'快捷定時器'}function setTime(s,add=false){remaining=Math.min(359999,Math.max(0,(add?(running?Math.max(0,(end-Date.now())/1000):remaining):0)+s));if(running)end=Date.now()+remaining*1000;$('message').textContent='';save();render()}function toggle(){if(!remaining)return;if(running){remaining=Math.max(0,(end-Date.now())/1000);running=false}else{end=Date.now()+remaining*1000;running=true}save();render()}function alarm(){if(!sound)return;try{let c=new(window.AudioContext||window.webkitAudioContext)();for(let i=0;i<3;i++){let o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.value=.15;o.frequency.value=880;o.start(c.currentTime+i*.5);o.stop(c.currentTime+i*.5+.3)}}catch{}}presets.forEach(([l,s])=>{let b=document.createElement('button');b.textContent=l;b.onclick=()=>setTime(s,remaining>0);$('presets').append(b)});function mode(n){$('keys').hidden=!n;$('presets').hidden=n;$('quick').classList.toggle('selected',!n);$('numeric').classList.toggle('selected',n)}$('quick').onclick=()=>mode(false);$('numeric').onclick=()=>mode(true);['1','2','3','4','5','6','7','8','9','⌫','0','✓'].forEach(k=>{let b=document.createElement('button');b.textContent=k;b.onclick=()=>{if(k==='✓'){let d=digits.padStart(6,'0');setTime(Number(d.slice(0,2))*3600+Number(d.slice(2,4))*60+Number(d.slice(4)));digits='';mode(false)}else{digits=k==='⌫'?digits.slice(0,-1):(digits+k).slice(-6);let d=digits.padStart(6,'0');$('message').textContent=d.slice(0,2)+':'+d.slice(2,4)+':'+d.slice(4)}};$('keys').append(b)});$('play').onclick=$('big').onclick=toggle;$('reset').onclick=()=>{running=false;setTime(0)};function settings(){$('dialog').showModal()}$('settings').onclick=$('prefs').onclick=$('custom').onclick=settings;$('home').onclick=()=>mode(false);$('done').onclick=()=>$('dialog').close();$('apply').onclick=()=>{let m=Number($('minutes').value);if(m>=1&&m<=5999){setTime(m*60);$('dialog').close()}};$('sound').onchange=()=>{sound=$('sound').checked;save()};$('expand').onclick=async()=>{$('full').hidden=false;try{await $('full').requestFullscreen()}catch{}};$('close').onclick=()=>{$('full').hidden=true;if(document.fullscreenElement)document.exitFullscreen()};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('full').hidden=true});try{let s=JSON.parse(localStorage.getItem('timer-v1'));if(s){remaining=s.remaining||0;running=!!s.running;end=s.end||0;sound=s.sound!==false;if(running)remaining=Math.max(0,(end-Date.now())/1000);if(!remaining)running=false}}catch{}$('sound').checked=sound;render();setInterval(()=>{if(running){remaining=Math.max(0,(end-Date.now())/1000);if(!remaining){running=false;$('message').textContent='時間到！';alarm();save()}render()}},200);
</script></html>
