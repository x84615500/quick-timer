<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="快捷定時器"><title>快捷定時器</title><style>html{color-scheme:dark;background:#000;color:white;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0}main{max-width:500px;margin:auto;padding:24px 20px 100px}button{font:inherit;cursor:pointer;background:none;border:0;color:#009dff}button:focus-visible{outline:2px solid white}header{display:flex;align-items:center;justify-content:space-between}header button{font-size:35px}h1{font-size:21px;font-weight:500}header span{width:35px}#time{font-size:clamp(58px,15vw,78px);font-weight:300;text-align:center;margin:75px 0 35px;padding:12px 0;border:2px solid white;border-radius:7px;font-variant-numeric:tabular-nums;color:#777}.active{color:#4a97ff!important;border-color:transparent!important}.controls{display:flex;justify-content:space-around;margin-bottom:50px}.controls button{font-size:39px}.controls button:disabled{opacity:.25}#play{color:#d22ce8}#reset{color:#ff454d}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid button{border-radius:60px;background:#1e1e20;min-height:65px;font-size:clamp(18px,5vw,27px);padding:10px 2px}.grid button:active{background:#444}.switch{display:flex;justify-content:center;margin:55px auto 20px;background:#202023;border-radius:10px;width:max-content;padding:3px}.switch button{color:white;padding:10px 13px;border-radius:8px}.selected{background:#59595f}#message{text-align:center;color:#aaa;min-height:20px;font-size:14px}nav{position:fixed;bottom:0;background:#000e;left:50%;transform:translateX(-50%);width:min(100%,500px);display:flex;justify-content:space-around;padding:18px}nav button{color:#777;font-size:12px}nav b{display:block;font-size:30px;font-weight:400;margin-bottom:6px}nav button:first-child{color:#009dff}dialog{background:#19191b;color:white;border:1px solid #444;border-radius:20px;padding:26px;width:min(90%,380px)}dialog::backdrop{background:#000b}label{display:flex;justify-content:space-between;margin:25px 0}#minutes{width:90px;padding:10px}dialog button{padding:12px}#full{position:fixed;inset:0;background:black;z-index:10;display:grid;place-items:center}#big{font-size:21vw;font-variant-numeric:tabular-nums;border:2px solid white;padding:20px;border-radius:8px;white-space:nowrap}#close{position:absolute;left:20px;top:20px;font-size:45px}[hidden]{display:none!important}@media(orientation:portrait){#big{transform:rotate(-90deg);font-size:20vh}}.hint{font-size:12px;color:#999;line-height:1.6}#full{display:flex;flex-direction:column;justify-content:space-between;padding:max(20px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));height:100dvh;overflow:auto}#full header{width:100%;gap:20px}#close{position:static;font-size:18px;padding:14px;background:#202024;border-radius:12px}#big{transform:none;font-size:clamp(56px,15vw,180px);padding:0;border:0;max-width:100%;color:#4a97ff}#full .clockbox{min-width:210px;text-align:center;background:#18181b;padding:16px 24px;border-radius:18px}#fullClock{font-size:clamp(24px,5vw,40px);margin-top:7px}.readouts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}.readouts button,#fullPlay{min-height:48px;background:#222228;border-radius:12px;padding:12px 16px;font-size:17px}.clockline{text-align:center;color:#ccc;margin-top:15px;font-size:18px}.state{text-align:center;color:#ccc}#full h2{font-size:19px;font-weight:400;margin:10px}#full .readouts{margin:10px 0}button:focus-visible{outline:3px solid white;outline-offset:3px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0)}@media(orientation:landscape) and (max-height:500px){#full{padding:12px;gap:4px}#full .clockbox{padding:8px}#big{font-size:20vh}#full h2{margin:0}} </style><main><header><button id="expand" aria-label="進入全螢幕倒數">⤢</button><h1>快捷定時器</h1><span></span></header><div id="time" role="timer" aria-live="off" aria-label="剩餘時間">00:00</div><div class="clockline">現在時間 <time id="clock" aria-live="off"></time></div><div class="readouts"><button id="readRemaining" aria-label="播報剩餘時間、現在時間與預計結束時間">播報時間資訊</button></div><div class="controls"><button id="play" aria-label="開始" disabled>▷</button><button id="reset" aria-label="重設" disabled>⊗</button><button id="settings" aria-label="設定">⚙</button></div><div id="presets" class="grid"></div><div id="keys" class="grid" hidden></div><div class="switch"><button id="quick" class="selected">快捷按鈕</button><button id="numeric">數字鍵盤</button></div><p id="message" role="status"></p></main><nav><button id="home"><b>ϟ</b>快捷定時器</button><button id="custom"><b>☆</b>自訂時間</button><button id="prefs"><b>⚙</b>設定</button></nav><dialog id="dialog"><h2>定時器設定</h2><label>結束提示音<input id="sound" type="checkbox" checked></label><fieldset id="reminderMode"><legend>語音提示模式</legend><label><input type="radio" name="reminderMode" value="every5">每5分鐘提示</label><label><input type="radio" name="reminderMode" value="under30">30分以下每5分鐘提示</label></fieldset><label>新增常用時間（分鐘）<input id="minutes" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="輸入分鐘"></label><button id="apply">新增時間</button><button id="done">完成</button><p class="hint">iPhone 隱藏網址列與工具列：在 Safari 分享選單選「加入主畫面」，啟用「以網頁 App 開啟」，再從主畫面圖示啟動。系統狀態列可能保留。關閉網頁後不會發出提示音，重新開啟會恢復剩餘時間。數字鍵盤依時、分、秒輸入。</p></dialog><section id="full" role="dialog" aria-modal="true" aria-labelledby="fullTitle" hidden><header><h2 id="fullTitle">全螢幕倒數</h2><button id="close">離開全螢幕</button></header><div><p class="state" id="fullState"></p><div id="big" role="timer" aria-live="off" tabindex="0">00:00</div></div><div class="clockbox">現在時間<time id="fullClock" style="display:block" aria-live="off"></time></div><div class="readouts"><button id="fullReadRemaining" aria-label="播報剩餘時間、現在時間與預計結束時間">播報時間資訊</button><button id="fullPlay">暫停</button></div></section><script>
const $=id=>document.getElementById(id),presets=JSON.parse(localStorage.getItem('timer-presets')||'[]');let reminderMode=localStorage.getItem('timer-reminder-mode')||'under30',remaining=0,running=false,end=0,digits='',sound=true,nextNotice=0,lastSpokenSecond=Infinity;
function duration(n){n=Math.max(0,Math.ceil(n));return [Math.floor(n/3600)?Math.floor(n/3600)+'小時':'',Math.floor(n%3600/60)?Math.floor(n%3600/60)+'分':'',n%60?n%60+'秒':''].join('')||'零秒'}
function speak(text){$('message').textContent=text;if('speechSynthesis' in window){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=1;window.speechSynthesis.speak(u)}}
function clockText(d=new Date()){const h=d.getHours(),period=h<5?'凌晨':h<12?'上午':h===12?'中午':h<18?'下午':'晚上';return period+(h%12||12)+'點'+d.getMinutes()+'分'}
function finishText(now,target){const a=new Date(now.getFullYear(),now.getMonth(),now.getDate()),b=new Date(target.getFullYear(),target.getMonth(),target.getDate()),days=Math.round((b-a)/86400000);return(days===1?'明天':days>1?days+'天後':'今天')+clockText(target)}
function updateClock(){const d=new Date(),t=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');$('clock').textContent=$('fullClock').textContent=t;$('clock').ariaLabel=$('fullClock').ariaLabel='現在時間'+clockText()}
function readRemaining(){const now=new Date();if(running)remaining=Math.max(0,(end-now.getTime())/1000);let text='倒數計時剩餘'+duration(remaining)+'。目前時間'+clockText(now)+'。';if(remaining>0){const target=new Date(running?end:now.getTime()+remaining*1000);text+=running?'預計結束時間是'+finishText(now,target)+'。':'計時已暫停；若現在繼續，預計結束時間是'+finishText(now,target)+'。'}else{text+='目前沒有進行中的倒數計時。'}speak(text)}
function nextMilestone(r){if(reminderMode==='every5'){if(r>300)return Math.floor((r-1)/300)*300}else if(r>1800)return Math.floor((r-1)/1800)*1800;if(r>300)return Math.floor((r-1)/300)*300;if(r>60)return Math.floor((r-1)/60)*60;if(r>5)return Math.floor((r-1)/30)*30;return Math.floor(r)-1}
function start(s,add=false){setTime(s,add);if(remaining>0){end=Date.now()+remaining*1000;running=true;nextNotice=nextMilestone(remaining);lastSpokenSecond=Math.ceil(remaining);save();render();speak(add?'已加時'+duration(s)+'，繼續倒數，剩餘'+duration(remaining):'開始倒數計時'+duration(remaining))}}
function save(){localStorage.setItem('timer-v1',JSON.stringify({remaining,running,end,sound}))}function format(n){n=Math.max(0,Math.ceil(n));let h=Math.floor(n/3600);return(h?h+':':'')+String(Math.floor(n%3600/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function render(){let t=format(remaining);$('time').textContent=$('big').textContent=t;$('time').classList.toggle('active',remaining>0);$('play').textContent=running?'Ⅱ':'▷';$('play').ariaLabel=running?'暫停':'開始';$('play').disabled=remaining<=0;$('time').ariaLabel=$('big').ariaLabel='倒數剩餘'+duration(remaining);$('fullState').textContent=running?'正在倒數':remaining?'已暫停':'尚未開始';$('fullPlay').textContent=running?'暫停倒數':'繼續倒數';$('fullPlay').disabled=remaining<=0;$('reset').disabled=remaining<=0;[...$('presets').children].forEach((b,i)=>b.textContent=(remaining>0?'+ ':'')+presets[i][0]);document.title=(remaining?t+' · ':'')+'快捷定時器'}function setTime(s,add=false){remaining=Math.min(359999,Math.max(0,(add?(running?Math.max(0,(end-Date.now())/1000):remaining):0)+s));if(running)end=Date.now()+remaining*1000;$('message').textContent='';save();render()}function toggle(){if(!remaining)return;if(running){remaining=Math.max(0,(end-Date.now())/1000);running=false}else{end=Date.now()+remaining*1000;running=true;nextNotice=nextMilestone(remaining);lastSpokenSecond=Math.ceil(remaining)}save();render()}
function announceMilestone(r){if(r<=5){const sec=Math.ceil(r);if(sec<lastSpokenSecond&&sec>=1){lastSpokenSecond=sec;speak(sec+'秒')}return}if(nextNotice>0&&r<=nextNotice){const said=nextNotice; speak('倒數剩餘'+duration(said));nextNotice=nextMilestone(said-0.01)}}function alarm(){if(!sound)return;try{let c=new(window.AudioContext||window.webkitAudioContext)();for(let i=0;i<3;i++){let o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.value=.15;o.frequency.value=880;o.start(c.currentTime+i*.5);o.stop(c.currentTime+i*.5+.3)}}catch{}}function addPreset([l,s]){let b=document.createElement('button');b.textContent=l;b.onclick=()=>start(s,remaining>0);$('presets').append(b)}presets.forEach(addPreset);function mode(n){$('keys').hidden=!n;$('presets').hidden=n;$('quick').classList.toggle('selected',!n);$('numeric').classList.toggle('selected',n)}$('quick').onclick=()=>mode(false);$('numeric').onclick=()=>mode(true);['1','2','3','4','5','6','7','8','9','⌫','0','✓'].forEach(k=>{let b=document.createElement('button');b.textContent=k;b.onclick=()=>{if(k==='✓'){let d=digits.padStart(6,'0');start(Number(d.slice(0,2))*3600+Number(d.slice(2,4))*60+Number(d.slice(4)));digits='';mode(false)}else{digits=k==='⌫'?digits.slice(0,-1):(digits+k).slice(-6);let d=digits.padStart(6,'0');$('message').textContent=d.slice(0,2)+':'+d.slice(2,4)+':'+d.slice(4)}};$('keys').append(b)});$('play').onclick=$('fullPlay').onclick=()=>{toggle();speak(running?'繼續倒數，剩餘'+duration(remaining):'已暫停，剩餘'+duration(remaining))};$('reset').onclick=()=>{running=false;setTime(0)};function settings(){$('dialog').showModal()}$('settings').onclick=$('prefs').onclick=$('custom').onclick=settings;$('home').onclick=()=>mode(false);$('done').onclick=()=>$('dialog').close();document.querySelector('input[name="reminderMode"][value="'+reminderMode+'"]').checked=true;$('minutes').oninput=()=>{$('minutes').value=$('minutes').value.replace(/[^0-9]/g,'')};$('reminderMode').onchange=(event)=>{reminderMode=event.target.value;localStorage.setItem('timer-reminder-mode',reminderMode);if(running)nextNotice=nextMilestone(remaining)};$('apply').onclick=()=>{let m=Number($('minutes').value);if(m>=1&&m<=5999&&!presets.some(x=>x[1]===m*60)){let item=[m+'分鐘',m*60];presets.push(item);localStorage.setItem('timer-presets',JSON.stringify(presets));addPreset(item);$('minutes').value=''}};$('sound').onchange=()=>{sound=$('sound').checked;save()};$('readRemaining').onclick=$('fullReadRemaining').onclick=readRemaining;
function closeFull(){$('full').hidden=true;document.querySelector('main').inert=false;document.querySelector('nav').inert=false;if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});$('expand').focus()}
$('expand').onclick=async()=>{$('full').hidden=false;document.querySelector('main').inert=true;document.querySelector('nav').inert=true;$('fullReadRemaining').focus();try{if($('full').requestFullscreen)await $('full').requestFullscreen()}catch{};};$('close').onclick=closeFull;
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&!$('full').hidden)closeFull()});document.addEventListener('keydown',e=>{if(!$('full').hidden){if(e.key==='Escape'){closeFull();return}if(e.key==='Tab'){const bs=[...$('full').querySelectorAll('button:not(:disabled),[tabindex="0"]')];const first=bs[0],last=bs[bs.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}if(e.altKey&&e.key.toLowerCase()==='r'){e.preventDefault();readRemaining()}if(e.altKey&&e.key.toLowerCase()==='t'){e.preventDefault();readRemaining()}});
updateClock();setInterval(updateClock,1000);try{let s=JSON.parse(localStorage.getItem('timer-v1'));if(s){remaining=s.remaining||0;running=!!s.running;end=s.end||0;sound=s.sound!==false;if(running)remaining=Math.max(0,(end-Date.now())/1000);if(!remaining)running=false}}catch{}$('sound').checked=sound;document.querySelector('input[name="reminderMode"][value="'+reminderMode+'"]').checked=true;render();setInterval(()=>{if(running){remaining=Math.max(0,(end-Date.now())/1000);if(!remaining){running=false;nextNotice=0;speak('時間到，倒數計時結束');alarm();save()}else announceMilestone(remaining);render()}},200);
</script></html>
